<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Motorra · Propuestas alternativas</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .ab { font-family: var(--font-body); color: var(--ink-900); position: absolute; inset: 0; overflow: hidden; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 9999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .btn { font-family: var(--font-body); font-weight: 600; font-size: 14px; padding: 14px 22px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; line-height: 1; }
  .btn-primary { background: #FF5B2E; color: white; }
  .btn-ghost { background: transparent; color: inherit; border-color: currentColor; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="artboards.jsx"></script>
<script type="text/babel" src="artboards-expanded.jsx"></script>
<script type="text/babel">
const App = () => {
  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
  return (
    <DesignCanvas>
      <DCSection id="logos" title="Logo · Club Motorra" subtitle="4 direcciones — del crest racing al member badge minimal">
        <DCArtboard id="logo-variants" label="4 propuestas de logo" width={1280} height={520}>
          <LogoVariants />
        </DCArtboard>
      </DCSection>
      <DCSection id="homes" title="Hero alternativos para Home" subtitle="5 direcciones distintivas — cada una compromete con una estética">
        <DCArtboard id="home-1" label="01 · Tesla / Stripe · Minimal premium" width={1280} height={800}>
          <Home1Minimal />
        </DCArtboard>
        <DCArtboard id="home-2" label="02 · Airbnb / Notion · Warm friendly" width={1280} height={800}>
          <Home2Airbnb />
        </DCArtboard>
        <DCArtboard id="home-3" label="03 · Porsche / F1 · Racing" width={1280} height={800}>
          <Home3Racing />
        </DCArtboard>
        <DCArtboard id="home-4" label="04 · Apple · Ultra simple" width={1280} height={800}>
          <Home4Apple />
        </DCArtboard>
        <DCArtboard id="home-5" label="05 · Discord · Community club" width={1280} height={800}>
          <Home5Club />
        </DCArtboard>
      </DCSection>
      <DCSection id="screens-2" title="Profundización · 2da pantalla de cada dirección" subtitle="Prueba de que cada dirección sostiene un sistema completo, no sólo un hero">
        <DCArtboard id="dir1-inv" label="01 · Inventario · Tesla minimal" width={1280} height={900}>
          <Dir1Inventory />
        </DCArtboard>
        <DCArtboard id="dir2-cat" label="02 · Categorías · Airbnb explore" width={1280} height={900}>
          <Dir2Categories />
        </DCArtboard>
        <DCArtboard id="dir3-found" label="03 · Fundadores countdown · F1" width={1280} height={900}>
          <Dir3Founders />
        </DCArtboard>
        <DCArtboard id="dir4-detail" label="04 · Ficha · Apple takeover" width={1280} height={900}>
          <Dir4Detail />
        </DCArtboard>
        <DCArtboard id="dir5-profile" label="05 · Perfil de miembro · Discord" width={1280} height={900}>
          <Dir5Profile />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
};
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

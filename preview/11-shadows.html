<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 24px 0; background: var(--paper); }
  .card { width: 700px; padding: 30px 32px 40px; box-sizing: border-box; font-family: var(--font-body); }
  .row { display: flex; gap: 28px; justify-content: space-between; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 90px; height: 70px; background: var(--white); border-radius: 12px; }
  .name { font-size: 11px; font-weight: 700; color: var(--ink-700); font-family: var(--font-mono); }
  .px { font-size: 10px; color: var(--ink-400); font-family: var(--font-mono); }
  .group-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--ink-500); margin-bottom: 22px; }
</style>
</head>
<body>
  <div class="card">
    <div class="group-label">Shadows · elevation</div>
    <div class="row">
      <div class="item"><div class="box" style="box-shadow: none; border:1px solid var(--border)"></div><div class="name">sh-0</div><div class="px">flat</div></div>
      <div class="item"><div class="box" style="box-shadow: 0 1px 2px rgba(14,16,21,0.06), 0 0 0 1px rgba(14,16,21,0.04)"></div><div class="name">sh-1</div><div class="px">rest card</div></div>
      <div class="item"><div class="box" style="box-shadow: 0 2px 4px rgba(14,16,21,0.05), 0 4px 12px rgba(14,16,21,0.06)"></div><div class="name">sh-2</div><div class="px">hover</div></div>
      <div class="item"><div class="box" style="box-shadow: 0 6px 16px rgba(14,16,21,0.08), 0 2px 4px rgba(14,16,21,0.04)"></div><div class="name">sh-3</div><div class="px">dropdown</div></div>
      <div class="item"><div class="box" style="box-shadow: 0 16px 40px rgba(14,16,21,0.14), 0 4px 8px rgba(14,16,21,0.06)"></div><div class="name">sh-4</div><div class="px">modal</div></div>
      <div class="item"><div class="box" style="box-shadow: 0 24px 64px rgba(14,16,21,0.22), 0 8px 16px rgba(14,16,21,0.08)"></div><div class="name">sh-pop</div><div class="px">popover</div></div>
    </div>
  </div>
</body>
</html>

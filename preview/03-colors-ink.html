<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); }
  .card { width: 700px; padding: 28px 32px; box-sizing: border-box; font-family: var(--font-body); }
  .swatches { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .swatch { aspect-ratio: 1 / 1.6; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; justify-content: flex-end; font-size: 9px; font-weight: 600; box-sizing: border-box; border: 1px solid rgba(14,16,21,0.06); }
  .swatch .hex { font-family: var(--font-mono); font-size: 8px; opacity: 0.7; margin-top: 1px; }
  .group-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--ink-500); margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="card">
    <div class="group-label">Ink · neutrals + paper</div>
    <div class="swatches">
      <div class="swatch" style="background:#FFFFFF; color:#5A6275;"><span>white</span><span class="hex">FFFFFF</span></div>
      <div class="swatch" style="background:#FAF7F0; color:#5A6275;"><span>paper</span><span class="hex">FAF7F0</span></div>
      <div class="swatch" style="background:#F1ECE0; color:#5A6275;"><span>paper-2</span><span class="hex">F1ECE0</span></div>
      <div class="swatch" style="background:#ECEFF4; color:#5A6275;"><span>ink-100</span><span class="hex">ECEFF4</span></div>
      <div class="swatch" style="background:#D9DEE7; color:#3F4658;"><span>ink-200</span><span class="hex">D9DEE7</span></div>
      <div class="swatch" style="background:#B8BFCE; color:#1A1E26;"><span>ink-300</span><span class="hex">B8BFCE</span></div>
      <div class="swatch" style="background:#8B93A7; color:#FFF;"><span>ink-400</span><span class="hex">8B93A7</span></div>
      <div class="swatch" style="background:#5A6275; color:#FFF;"><span>ink-500</span><span class="hex">5A6275</span></div>
      <div class="swatch" style="background:#2A3040; color:#FFF;"><span>ink-700</span><span class="hex">2A3040</span></div>
      <div class="swatch" style="background:#0E1015; color:#FFF;"><span>ink-900</span><span class="hex">0E1015</span></div>
    </div>
  </div>
</body>
</html>

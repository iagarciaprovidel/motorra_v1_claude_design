<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); }
  .card { width: 700px; padding: 32px 36px; box-sizing: border-box; }
  .specimen { font-family: var(--font-display); color: var(--ink-900); }
  .big { font-size: 84px; line-height: 0.95; letter-spacing: -0.04em; font-weight: 800; font-variation-settings: "opsz" 72; }
  .meta { display: flex; gap: 24px; margin-top: 18px; font-family: var(--font-body); font-size: 11px; color: var(--ink-500); }
  .meta div span { display: block; color: var(--ink-900); font-weight: 600; font-size: 13px; margin-top: 2px; }
  .glyphs { font-family: var(--font-display); font-size: 32px; font-weight: 700; letter-spacing: -0.01em; margin-top: 16px; color: var(--ink-700); }
</style>
</head>
<body>
  <div class="card">
    <div class="specimen big">Motorra</div>
    <div class="glyphs">Aa Bb Cc Ñ Õ Á · 0123 456789 · &amp; ?</div>
    <div class="meta">
      <div>Family<span>Bricolage Grotesque</span></div>
      <div>Use<span>Display · h1–h4 · prices</span></div>
      <div>Weights<span>400 / 600 / 700 / 800</span></div>
      <div>Variable<span>opsz 12–96</span></div>
    </div>
  </div>
</body>
</html>

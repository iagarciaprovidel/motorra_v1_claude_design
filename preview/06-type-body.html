<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); }
  .card { width: 700px; padding: 32px 36px; box-sizing: border-box; font-family: var(--font-body); color: var(--ink-900); }
  .big { font-size: 48px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .para { font-size: 15px; line-height: 1.6; color: var(--ink-700); margin-top: 16px; max-width: 580px; }
  .meta { display: flex; gap: 24px; margin-top: 16px; font-size: 11px; color: var(--ink-500); }
  .meta div span { display: block; color: var(--ink-900); font-weight: 600; font-size: 13px; margin-top: 2px; }
</style>
</head>
<body>
  <div class="card">
    <div class="big">Manrope — body &amp; UI</div>
    <div class="para">Vendé tu auto en 48 horas. Lo tasamos en 3 minutos, lo inspeccionamos sin costo y te pagamos al instante. Compatible con tildes, ñ, õ, ç — listo para ES, PT y EN.</div>
    <div class="meta">
      <div>Family<span>Manrope</span></div>
      <div>Use<span>Body · UI · forms</span></div>
      <div>Weights<span>400 / 500 / 600 / 700 / 800</span></div>
    </div>
  </div>
</body>
</html>

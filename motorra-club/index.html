<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F4EFE6; color: #1F1B16; }
  ::selection { background: #FF5B2E; color: white; }
  @keyframes pulse-dot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
  @keyframes slide-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* Airbnb-warm palette (landing) */
  .mc-warm { --bg: #F4EFE6; --bg-card: #FFFFFF; --fg: #1F1B16; --fg-muted: #5A4F3C; --fg-subtle: #8B7E66; --line: #E5DECC; --accent: #FF5B2E; --accent-deep: #B33310; }
  /* Discord-club palette (app) */
  .mc-club { --bg: #1E2030; --bg-side: #171825; --bg-card: #272A3E; --bg-elevated: #313450; --fg: #F3F4F6; --fg-muted: #D1D5DB; --fg-subtle: #9CA3AF; --fg-ghost: #6B7280; --line: rgba(255,255,255,0.08); --accent: #FF5B2E; --accent-soft: rgba(255,91,46,0.16); }

  .scrollbar-none { scrollbar-width: none; }
  .scrollbar-none::-webkit-scrollbar { display: none; }
</style>
